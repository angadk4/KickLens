name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    # T-210: a real Postgres so the DB-backed guarantees actually RUN in CI
    # (leakage suite recompute-parity, schema constraints, write-once ledger) — not skip.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kicklens
          POSTGRES_PASSWORD: kicklens
          POSTGRES_DB: kicklens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kicklens -d kicklens_test"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # points the integration + leakage suites at the CI Postgres
      DATABASE_URL: postgresql://kicklens:kicklens@localhost:5432/kicklens_test

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the pushed COMMIT RANGE; the default shallow clone (depth 1)
          # leaves the range's base commit absent, so its `git log base...head` errors and
          # gitleaks bails having scanned ~0 bytes (CI #45: "no leaks found" after scanning
          # nothing — a hollow guarantee, exactly the never-cut-suite failure mode).
          fetch-depth: 0

      # The M1 integration suite (tests/test_ingestion_pipeline.py) loads the REAL
      # football-data.co.uk USA.csv. `fetch_usa_csv` already has a cached-snapshot fallback for
      # the case where that host is unreachable — a Contract fallback — but a fresh checkout has
      # no cache, so the fallback could never fire HERE. That made CI's green depend on a third
      # party's uptime: on 2026-09-05 the host went fully 503 and every run went red on commits
      # that touched nothing but anchors/. Carrying data/raw between runs gives the fallback
      # something to fall back TO, so the suite still runs against real data during an outage.
      # The key rotates per run so a reachable upstream still refreshes the snapshot; the
      # restore-key prefix pulls the newest cache otherwise.
      - name: Restore cached USA.csv snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: usa-csv-${{ github.run_id }}
          restore-keys: usa-csv-

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync (frozen lockfile)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Tests incl. leakage + schema + write-once (blocks merge if red)
        run: uv run pytest

      - name: Assert the never-cut suites executed (not silently no-op'd)
        # The failure mode to catch is the WHOLE suite silently skipping — e.g. an unset
        # DATABASE_URL makes every DB test skip and pytest still exits 0, a false green.
        # Individual data-gated skips are expected here: the recompute-parity checks need
        # the full historical load (absent in a fresh CI DB) and run in the sealed
        # environment. So: fail only if ZERO tests actually passed.
        run: |
          uv run pytest tests/test_leakage.py tests/test_schema_core.py \
            tests/test_schema_audit.py -rs | tee nevercut.log
          if ! grep -qE "[1-9][0-9]* passed" nevercut.log; then
            echo "::error::never-cut suites produced no passing tests — they did not execute"
            exit 1
          fi
          echo "never-cut suites executed against Postgres"

      # Saved even when the job failed: a red run that DID reach the network still holds a
      # snapshot worth carrying forward, and that is precisely the run whose successor needs it.
      - name: Save USA.csv snapshot cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: usa-csv-${{ github.run_id }}

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The dashboard: typecheck+build, lint, and the matchPhase unit tests — the phase model
  # decides when the site stops claiming a game is "in play", so its boundaries are gated
  # here, not just locally. (Deploy builds the same app; this catches breakage pre-merge.)
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Lint (oxlint)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm test
